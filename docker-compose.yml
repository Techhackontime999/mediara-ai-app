services:
  api:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py ensure_superuser &&
             python manage.py send_follow_up_reminders &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in your .env}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS in your .env}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"
      ADMIN_URL: "${ADMIN_URL:-secret-admin}"
      DJANGO_SUPERUSER_EMAIL: "${DJANGO_SUPERUSER_EMAIL:-}"
      DJANGO_SUPERUSER_NAME: "${DJANGO_SUPERUSER_NAME:-}"
      DJANGO_SUPERUSER_PASSWORD: "${DJANGO_SUPERUSER_PASSWORD:-}"
      DB_ENGINE: "${DB_ENGINE:-postgres}"
      DATABASE_URL: "${DATABASE_URL:-}"
      DB_POSTGRES: "true"
      POSTGRES_DB: "${POSTGRES_DB:-mediara}"
      POSTGRES_USER: "${POSTGRES_USER:-mediara}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your .env}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: "${POSTGRES_SSLMODE:-}"
      POSTGRES_CONN_MAX_AGE: "${POSTGRES_CONN_MAX_AGE:-60}"
      MYSQL_DB: "${MYSQL_DB:-mediara}"
      MYSQL_USER: "${MYSQL_USER:-mediara}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-mediara}"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MONGO_URL: "${MONGO_URL:-}"
      MONGO_DB: "${MONGO_DB:-mediara}"
      CHANNELS_REDIS: "true"
      REDIS_URL: "redis://redis:6379/0"
      PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-http://localhost:8000}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_FALLBACK_ENABLED: "${AI_FALLBACK_ENABLED:-True}"
      EMAIL_HOST: "${EMAIL_HOST:-}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-True}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-Mediara AI <no-reply@mediara.ai>}"
      JWT_ACCESS_MINUTES: "${JWT_ACCESS_MINUTES:-120}"
      JWT_REFRESH_DAYS: "${JWT_REFRESH_DAYS:-30}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-production}"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend:/app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-mediara}"
      POSTGRES_USER: "${POSTGRES_USER:-mediara}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediara} -d ${POSTGRES_DB:-mediara}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

  # Optional MySQL/MariaDB alternative to the Postgres `db` service above.
  # Enable the whole MySQL topology with:
  #   DB_ENGINE=mysql docker compose --profile mysql up --build
  mysql:
    image: mysql:8
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DB:-mediara}"
      MYSQL_USER: "${MYSQL_USER:-mediara}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-mediara}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-change-me-root}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional MongoDB for the auxiliary store (analytics / unstructured data).
  # Enable with:  docker compose --profile mongo up -d
  mongo:
    image: mongo:7
    profiles: ["mongo"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: "${MONGO_DB:-mediara}"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mysql_data:
  mongo_data: