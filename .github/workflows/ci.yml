name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Django system check
        run: python manage.py check
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-for-production

      - name: Run migrations (fresh DB)
        run: python manage.py migrate --noinput
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-for-production

      - name: Test suite (incl. LLM fallback engine + safety + privacy)
        run: python manage.py test
        env:
          DJANGO_SECRET_KEY: ci-test-key-not-for-production

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy config accounts mediation conversations ai resolutions agreements audit notifications security --ignore-missing-imports
        continue-on-error: true

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile (assembleDebug)
        run: ./gradlew :app:assembleDebug

      - name: Lint (lintDebug)
        run: ./gradlew :app:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html